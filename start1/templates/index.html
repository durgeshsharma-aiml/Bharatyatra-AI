<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Welcome to BharatYatra ✈️</title>
    <!-- Modern Font -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
    
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        
        body {
            font-family: 'Inter', sans-serif;
            
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #333;
            overflow: hidden; 
        }

        
        .welcome-card {
            background: rgba(255, 255, 255, 0.95);
            padding: 50px 40px;
            border-radius: 24px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.3);
            text-align: center;
            max-width: 450px;
            width: 90%;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            backdrop-filter: blur(10px); /* Glassmorphism Effect */
        }

        .welcome-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 25px 60px rgba(0,0,0,0.4);
        }

        
        .logo-icon {
            font-size: 4.5em;
            margin-bottom: 10px;
            animation: float 3s ease-in-out infinite; /* लोगो हल्का-हल्का हवा में तैरेगा */
        }

        @keyframes float {
            0% { transform: translateY(0px); }
            50% { transform: translateY(-10px); }
            100% { transform: translateY(0px); }
        }

        h1 {
            font-size: 2.5em;
            font-weight: 800;
            color: #1f2937;
            margin-bottom: 10px;
            letter-spacing: -1px;
        }

        p {
            color: #6b7280;
            font-size: 1.1em;
            margin-bottom: 35px;
            line-height: 1.6;
        }

        /* बटन्स का डिज़ाइन */
        .btn-container {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .btn {
            text-decoration: none;
            padding: 16px;
            border-radius: 14px;
            font-size: 1.15em;
            font-weight: 600;
            transition: all 0.3s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        /* Login Button - Primary */
        .btn-primary {
            background: #3b82f6;
            color: white;
            box-shadow: 0 4px 15px rgba(59, 130, 246, 0.4);
        }
        .btn-primary:hover {
            background: #2563eb;
            box-shadow: 0 8px 25px rgba(59, 130, 246, 0.5);
            transform: scale(1.02);
        }

        /* Register Button - Secondary */
        .btn-secondary {
            background: #f3f4f6;
            color: #4b5563;
            border: 2px solid transparent;
        }
        .btn-secondary:hover {
            background: #e5e7eb;
            color: #1f2937;
            transform: scale(1.02);
        }

    </style>
</head>
<body>

    <div class="welcome-card">
        <div class="logo-icon">✈️</div>
        <h1>BharatYatra</h1>
        <p>Plan your trips, split expenses, and share memories with friends—all in one place.</p>
        
        <div class="btn-container">
            <a href="/login" class="btn btn-primary">
                <span>🔐</span> Login to Account
            </a>
            <a href="/register" class="btn btn-secondary">
                <span>✨</span> Create New Account
            </a>
        </div>
    </div>


</body>
</html>
